# Crowdin: en.json is the source; translations are written next to it as <locale>.json.
# Language ids used by the servers (LanguageSystem): de=0, en=1, zh-TW=2, zh-CN=3.
# Placeholders: %p% (filled in order) and § colour codes must be kept as-is in translations.
preserve_hierarchy: true
files:
  - source: /en.json
    translation: /%locale%.json
    languages_mapping:
      locale:
        de: de
        zh-TW: zh-TW
        zh-CN: zh-CN
